services:
  - type: web
    name: system-x-star-backend
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Apply pending Prisma migrations before the app starts. Runs once per deploy
    # (after build, before start) so the DB schema matches the built client.
    preDeployCommand: pnpm migrate:deploy
    startCommand: pnpm start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: http://localhost:3000,https://xstar-clearance-admin.vercel.app
